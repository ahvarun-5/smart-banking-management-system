<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Banking Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sb-navbar py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-bank2 fs-3 text-warning me-2"></i>
                <span>SmartBank</span>
            </a>
            <div class="ms-auto">
                <a href="/pages/register.html" class="btn btn-outline-light btn-sm"><i class="bi bi-person-plus me-1"></i>Open Account</a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="sb-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="icon-wrapper bg-primary bg-opacity-10 text-primary mx-auto mb-3" style="width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted small">Access your secure banking portal</p>
                    </div>

                    <!-- Alert message container -->
                    <div id="alert-container"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggle-password" tabindex="-1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-sb-primary w-100 py-2 mb-3">
                            <span id="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <!-- Quick Demo Credentials -->
                    <div class="mt-4 pt-3 border-top">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <small class="text-muted fw-semibold">QUICK DEMO FILL</small>
                        </div>
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2" onclick="fillAdminCredentials()">
                            <i class="bi bi-person-badge-fill me-1 text-danger"></i>Fill Administrator (admin@smartbank.com)
                        </button>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted">Don't have an account? <a href="/pages/register.html" class="fw-semibold text-primary">Register here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            Smart Banking Management System &bull; Educational Banking Simulation Platform
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Check if redirected due to expired session
        if (new URLSearchParams(window.location.search).has('expired')) {
            showAlert('Your session has expired. Please log in again.', 'warning');
        }

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const pwdInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        function showAlert(message, type = 'danger') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        function fillAdminCredentials() {
            document.getElementById('email').value = 'admin@smartbank.com';
            document.getElementById('password').value = 'Admin@1234';
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            submitBtn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            try {
                const response = await Auth.login(email, password);
                API.showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    if (response.user && response.user.role === 'ROLE_ADMIN') {
                        window.location.href = '/pages/admin-dashboard.html';
                    } else {
                        window.location.href = '/pages/dashboard.html';
                    }
                }, 600);
            } catch (err) {
                showAlert(err.message || 'Login failed. Please check your credentials.', 'danger');
                submitBtn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
