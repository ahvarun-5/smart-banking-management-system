<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Smart Banking Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sb-navbar py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-bank2 fs-3 text-warning me-2"></i>
                <span>SmartBank</span>
            </a>
            <div class="ms-auto">
                <a href="/pages/login.html" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Registration Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="sb-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="icon-wrapper bg-success bg-opacity-10 text-success mx-auto mb-3" style="width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Create Customer Account</h3>
                        <p class="text-muted small">Open your digital simulated banking profile in seconds</p>
                    </div>

                    <!-- Alert message container -->
                    <div id="alert-container"></div>

                    <form id="register-form">
                        <div class="row g-3 mb-3">
                            <div class="col-md-12">
                                <label for="fullName" class="form-label fw-semibold">Full Legal Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe" required maxlength="100">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="john@example.com" required maxlength="100">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="phoneNumber" class="form-label fw-semibold">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" class="form-control" id="phoneNumber" placeholder="9876543210" required maxlength="20">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold">Residential Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-geo-alt"></i></span>
                                <textarea class="form-control" id="address" rows="2" placeholder="Street, City, Postal Code" required maxlength="500"></textarea>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Min. 6 chars" required minlength="6" maxlength="50">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-type password" required minlength="6" maxlength="50">
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-sb-accent w-100 py-2 mb-3">
                            <span id="btn-text"><i class="bi bi-check-circle-fill me-2"></i>Complete Registration</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">Already registered? <a href="/pages/login.html" class="fw-semibold text-primary">Sign in to your account</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            Smart Banking Management System &bull; Educational Banking Simulation Platform
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        function showAlert(message, type = 'danger') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter matching passwords.', 'warning');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters in length.', 'warning');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            submitBtn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            try {
                const requestData = {
                    fullName,
                    email,
                    phoneNumber,
                    address,
                    password,
                    confirmPassword
                };

                await API.post('/auth/register', requestData);
                API.showToast('Registration successful! Logging you in...', 'success');

                // Automatic login after successful registration
                try {
                    await Auth.login(email, password);
                    setTimeout(() => {
                        window.location.href = '/pages/dashboard.html';
                    }, 800);
                } catch (loginErr) {
                    window.location.href = '/pages/login.html?registered=true';
                }
            } catch (err) {
                showAlert(err.message || 'Registration failed. Email may already be registered.', 'danger');
                submitBtn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
