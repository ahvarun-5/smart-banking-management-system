# ===================================================================
# SMART BANKING MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# ===================================================================

server.port=8080
spring.application.name=smart-banking-management-system

# Database Configuration (Defaults to embedded persistent DB with MySQL compatibility)
# Set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER in environment to switch to live MySQL 8.x
spring.datasource.url=${DB_URL:jdbc:h2:file:./smartbank_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,VALUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SmartBankHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Resource Handling for Frontend
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Default Admin User Initialization Configuration
app.init.admin.enabled=true
app.init.admin.email=admin@smartbank.com
app.init.admin.password=Admin@1234
app.init.admin.name=System Administrator
app.init.admin.phone=9999999999
app.init.admin.address=Headquarters, Smart Bank Tower, Mumbai

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartbank=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
